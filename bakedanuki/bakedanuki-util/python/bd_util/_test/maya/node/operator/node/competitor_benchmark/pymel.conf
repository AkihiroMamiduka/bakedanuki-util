[loggers]
keys=root,pymel

[formatters]
keys=pymelFormatter

[handlers]
keys=consoleHandler

[logger_root]
level=NOTSET
handlers=
remove_existing_handlers=False

[logger_pymel]
level=WARNING
qualname=pymel
handlers=consoleHandler
propagate=0

[formatter_pymelFormatter]
format=%(name)s : %(levelname)s : %(message)s
class=logging.Formatter

[handler_consoleHandler]
class=StreamHandler
level=WARNING
formatter=pymelFormatter
args=(sys.__stdout__,)

[pymel]
